<mat-sidenav-container class="sidenav-container">
    <mat-sidenav #drawer mode="side" class="sidenav" fixedInViewport [opened]="isLargeScreen">
      <mat-toolbar>Finance Tracker</mat-toolbar>
      <mat-nav-list>
        <a mat-list-item routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
        <a mat-list-item routerLink="/expenses" routerLinkActive="active">Expenses</a>
        <a mat-list-item routerLink="/expenses/add">Add Expense</a>
      </mat-nav-list>
    </mat-sidenav>
  
    <mat-sidenav-content>
      <mat-toolbar color="primary">
        <button mat-icon-button (click)="drawer.toggle()" *ngIf="!isLargeScreen">
          <mat-icon>menu</mat-icon>
        </button>
        <span>Personal Finance Tracker</span>
      </mat-toolbar>
  
      <div class="main-content">
        <router-outlet></router-outlet>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
